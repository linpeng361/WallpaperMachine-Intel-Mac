# A pinned stable release: no crate uses a nightly feature, and a pin keeps local
# builds and CI on one compiler and CI's renderer cache valid until the pin moves.
# Raise it on purpose, in a change of its own (docs/build.md).
[toolchain]
channel = "1.99.1"
# Intel-Mac fork: build for x86_64. Add `aarch64-apple-darwin` back to ship
# a universal Rust staticlib on an Apple Silicon host.
targets = ["x86_64-apple-darwin"]
components = ["rust-src"]
